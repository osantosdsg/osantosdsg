<style>
:root{
  --bg:#07040f; --panel:rgba(26,12,52,.82); --line:rgba(170,110,255,.55); --glow:rgba(150,80,255,.42);
  --pur:#b98cff; --pur2:#e0caff; --gold:#f5c95c; --gold2:#ffe7a3; --goldline:rgba(245,201,92,.55);
  --txt:#efe6ff; --muted:#9a88bd; --red:#ff4b6a; --redglow:rgba(255,60,90,.45); --green:#5dffb0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:'Rajdhani',system-ui,sans-serif;font-size:17px;min-height:100%}
body{background:
  radial-gradient(ellipse at 50% -15%,rgba(140,60,255,.35),transparent 60%),
  radial-gradient(ellipse at 100% 110%,rgba(245,201,92,.10),transparent 50%),
  radial-gradient(ellipse at 0% 110%,rgba(90,30,200,.25),transparent 55%),var(--bg);
  padding-bottom:86px}
body.penalty{background:radial-gradient(ellipse at 50% -15%,rgba(255,40,80,.28),transparent 60%),radial-gradient(ellipse at 50% 120%,rgba(110,10,40,.35),transparent 60%),#0d030a}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 0}
.orb{font-family:'Orbitron',sans-serif;letter-spacing:.05em}
.cin{font-family:'Cinzel',serif;letter-spacing:.06em}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;position:relative;
  box-shadow:0 0 22px var(--glow),inset 0 0 26px rgba(140,70,255,.10)}
.panel:before,.panel:after{content:'';position:absolute;width:14px;height:14px;border:2px solid var(--gold);opacity:.85}
.panel:before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:10px}
.panel:after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:10px}
.panel.red{border-color:rgba(255,80,110,.75);box-shadow:0 0 22px var(--redglow)}
.panel.red:before,.panel.red:after{border-color:var(--red)}
.panel.gold{border-color:var(--goldline);box-shadow:0 0 22px rgba(245,201,92,.25)}
.sysbar{display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Orbitron';font-size:11px;color:var(--gold2);
  border:1px solid var(--goldline);padding:6px 12px;border-radius:20px;margin:0 auto 12px;width:max-content;background:rgba(245,201,92,.06)}
.sysbar .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.penalty .sysbar{color:#ffc0cc;border-color:rgba(255,80,110,.7);background:rgba(255,60,90,.08)}
.penalty .sysbar .dot{background:var(--red);box-shadow:0 0 8px var(--red)}
.ptitle{text-align:center;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.ptitle h2{font-family:'Orbitron';font-size:13px;color:var(--gold);letter-spacing:.16em}
.ptitle .sub{font-family:'Cinzel';font-size:19px;font-weight:800;margin-top:4px;color:var(--pur2)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.name{font-family:'Cinzel';font-size:24px;font-weight:800;color:var(--gold2);text-shadow:0 0 12px rgba(245,201,92,.35)}
.title{color:var(--muted);font-size:14px}
.rank{width:62px;height:62px;flex:none;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;
  font-family:'Orbitron';font-weight:900;font-size:28px;color:var(--gold2);background:radial-gradient(circle,rgba(150,80,255,.45),rgba(30,10,60,.9));
  box-shadow:0 0 18px rgba(245,201,92,.35),inset 0 0 14px rgba(150,80,255,.6)}
.lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:10px 0 5px}
.bar{height:9px;background:rgba(255,255,255,.06);border-radius:5px;overflow:hidden;border:1px solid rgba(170,110,255,.3)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#7a3cff,#c18cff);box-shadow:0 0 10px var(--pur);transition:width .5s}
.bar.gold>i{background:linear-gradient(90deg,#c9932b,#ffe08a);box-shadow:0 0 10px rgba(245,201,92,.6)}
.bar.green>i{background:linear-gradient(90deg,#1fae6a,#5dffb0)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:14px;font-weight:600;background:rgba(0,0,0,.25)}
.chip.g{color:var(--gold2);border-color:var(--goldline)}
.chip.f{color:#ffad66;border-color:rgba(255,173,102,.5)}
.big-timer{text-align:center;margin:4px 0 14px}
.big-timer .s{font-size:13px;color:var(--muted);letter-spacing:.08em}
.big-timer .t{font-family:'Orbitron';font-size:34px;font-weight:700;color:var(--pur2);text-shadow:0 0 14px var(--pur)}
.big-timer .t.warn{color:var(--gold2);text-shadow:0 0 14px rgba(245,201,92,.8)}
.big-timer .t.bad{color:var(--red);text-shadow:0 0 14px var(--red)}
.task{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid rgba(170,110,255,.25);border-radius:8px;margin-bottom:8px;background:rgba(0,0,0,.18)}
.task.ok{border-color:rgba(93,255,176,.55);background:rgba(93,255,176,.06)}
.task .ic{font-size:26px;width:36px;text-align:center}
.task .info{flex:1}
.task .nm{font-weight:700;font-size:18px}
.task .goal{font-size:13px;color:var(--muted)}
.task .st{font-family:'Orbitron';font-size:12px;text-align:right}
.task .st.ok{color:var(--green)}
.task .st.no{color:var(--gold2)}
.banner{text-align:center;font-family:'Orbitron';font-size:15px;padding:12px;border-radius:8px;margin-top:6px}
.banner.ok{color:var(--green);border:1px solid rgba(93,255,176,.5);background:rgba(93,255,176,.07)}
.banner.bad{color:#ffc0cc;border:1px solid rgba(255,80,110,.6);background:rgba(255,60,90,.08)}
.howto{font-size:15px;line-height:1.45;color:var(--pur2)}
.howto b{color:var(--gold2)}
.step{display:flex;gap:10px;padding:6px 0}
.step .n{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--gold);color:var(--gold2);display:grid;place-items:center;font-family:'Orbitron';font-size:12px}
.stat{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed rgba(170,110,255,.2)}
.stat:last-child{border-bottom:0}
.stat .k{font-family:'Orbitron';font-size:13px;color:var(--gold)}
.stat .k small{display:block;font-family:'Rajdhani';color:var(--muted);font-size:12px;letter-spacing:0}
.stat .v{font-family:'Orbitron';font-size:19px}
.wbig{text-align:center;margin:6px 0 4px}
.wbig .kg{font-family:'Orbitron';font-size:42px;font-weight:900;color:var(--gold2);text-shadow:0 0 16px rgba(245,201,92,.5)}
.wbig .d{font-size:15px;color:var(--muted)}
.ms{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed rgba(170,110,255,.2)}
.ms:last-child{border-bottom:0}
.ms .c{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;font-size:13px}
.ms.on .c{border-color:var(--gold);background:rgba(245,201,92,.2);color:var(--gold2)}
.ms .t{flex:1}
.ms .r{font-size:13px;color:var(--gold2);font-family:'Orbitron'}
.ms:not(.on) .r{color:var(--muted)}
.chart{width:100%;height:150px;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.grid div{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;border:1px solid rgba(170,110,255,.2);color:var(--muted)}
.grid .hd{border:0}
.grid .ok{background:rgba(140,70,255,.55);color:#fff;border-color:var(--pur)}
.grid .fail{background:rgba(255,60,90,.45);color:#fff;border-color:var(--red)}
.grid .today{border:2px solid var(--gold)}
.grid .off{opacity:.25}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.log{font-size:14px;padding:7px 0;border-bottom:1px dashed rgba(170,110,255,.15)}
.log:last-child{border-bottom:0}
.log em{color:var(--muted);font-style:normal;font-size:12px;margin-right:6px}
.pen{padding:12px;border:1px solid rgba(255,80,110,.5);border-radius:8px;margin-bottom:8px;background:rgba(255,60,90,.06)}
.pen.done{border-color:rgba(93,255,176,.45);background:rgba(93,255,176,.05)}
.pen.miss{border-color:rgba(255,80,110,.8);background:rgba(255,60,90,.14)}
.pen .h{font-weight:700;font-size:17px}
.pen .m{font-size:13px;color:var(--muted);margin-top:2px}
.rules .log{color:var(--pur2)}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,4,22,.96);border-top:1px solid var(--goldline);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 22px rgba(120,50,255,.25)}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;border:0;background:transparent;padding:10px 2px 12px;font-family:'Rajdhani';font-weight:700;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;cursor:pointer}
nav button .ic{font-size:21px}
nav button.on{color:var(--gold2);text-shadow:0 0 8px rgba(245,201,92,.6)}
nav .badge{position:absolute;top:5px;right:calc(50% - 22px);background:var(--red);color:#fff;font-size:11px;border-radius:9px;padding:0 6px}
.modal{position:fixed;inset:0;background:rgba(6,2,14,.86);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal.show{display:flex}
.modal .panel{width:100%;max-width:420px;animation:pop .28s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.mbtn{width:100%;margin-top:14px;padding:13px;font-family:'Orbitron';font-size:14px;letter-spacing:.1em;color:var(--bg);
  background:linear-gradient(180deg,#ffe08a,#d9a440);border:0;border-radius:8px;cursor:pointer;box-shadow:0 0 16px rgba(245,201,92,.45)}
.mbtn.red{background:linear-gradient(180deg,#ff7c93,#d8284a);color:#fff}
.owe{padding:8px 0;font-size:18px;border-bottom:1px dashed rgba(170,110,255,.2)}
.owe:last-child{border-bottom:0}
.sync{font-size:11px;color:var(--muted);text-align:center;margin:4px 0 12px}
.empty{text-align:center;color:var(--muted);padding:10px 0}

.rec{border:1px solid var(--goldline);background:rgba(245,201,92,.12);color:var(--gold2);font-family:'Rajdhani';font-weight:700;font-size:14px;border-radius:8px;padding:8px 10px;cursor:pointer;white-space:nowrap}
.rec:active{transform:scale(.96)}
.rec.wide{width:100%;padding:12px;font-size:16px;margin-top:10px}
.prova{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed rgba(170,110,255,.18);font-size:14px}
.prova:last-child{border-bottom:0}
.prova .s{font-family:'Orbitron';font-size:11px;white-space:nowrap}
.s.wait{color:var(--gold2)} .s.ok{color:var(--green)} .s.no{color:var(--red)}
.spin{width:38px;height:38px;border:3px solid rgba(245,201,92,.25);border-top-color:var(--gold);border-radius:50%;margin:10px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.panel.purple{border-color:rgba(185,140,255,.75);box-shadow:0 0 24px rgba(150,80,255,.45)}
.rt{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:6px;font-size:15px}
.rt .tm{font-family:'Orbitron';font-size:12px;color:var(--muted);width:44px}
.rt .ic{width:24px;text-align:center}
.rt .nm{flex:1}
.rt .nm small{display:block;color:var(--muted);font-size:12px}
.rt.on{background:rgba(245,201,92,.1);border:1px solid var(--goldline)}
.rt.on .tm{color:var(--gold2)}
.rt.past{opacity:.45}
.rt .now{font-family:'Orbitron';font-size:10px;color:var(--bg);background:var(--gold);border-radius:10px;padding:2px 7px}
.task.lost{opacity:.5}
.st.lost{color:var(--red);font-family:'Orbitron';font-size:11px}
.kc{display:flex;justify-content:space-around;text-align:center;margin:4px 0 10px}
.kc .big{font-family:'Orbitron';font-size:26px;color:var(--gold2)}
.kc small{color:var(--muted)}
.meal{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed rgba(170,110,255,.2);font-size:14px}
.meal .kk{font-family:'Orbitron';font-size:12px;color:var(--gold2);white-space:nowrap}
.meal small{color:var(--muted)}
.ch{padding:9px 0;border-bottom:1px dashed rgba(170,110,255,.2)}
.ch:last-child{border-bottom:0}
.ch .r{color:var(--gold2);font-family:'Orbitron';font-size:12px}
.ch.ok span{color:var(--green)!important}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:6px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bb{width:100%;background:linear-gradient(180deg,#ffe08a,#9b5cff);border-radius:4px 4px 0 0;min-height:2px}
.bc small{color:var(--muted);font-size:11px;margin-top:3px}
.grid div{position:relative}
.grid i.sp{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--gold)}

/* ---- refinamentos v5 ---- */
.panel.player{padding:18px 16px 16px;background:linear-gradient(160deg,rgba(60,24,120,.85),rgba(20,8,44,.9) 60%,rgba(40,20,10,.6));}
.tag{font-family:'Orbitron';font-size:10px;letter-spacing:.3em;color:var(--gold)}
.player .name{font-size:28px;line-height:1.1;margin:2px 0}
.player .title{font-style:italic}
.rank{flex-direction:column;line-height:1}
.rank small{font-size:8px;letter-spacing:.2em;color:var(--gold);font-weight:700;margin-bottom:2px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 4px}
.tile{border:1px solid rgba(185,140,255,.35);border-radius:8px;background:rgba(0,0,0,.28);padding:8px 4px;text-align:center}
.tile b{display:block;font-family:'Orbitron';font-size:17px;color:var(--pur2)}
.tile span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.tile.f b{color:#ffad66} .tile.g b{color:var(--gold2)}
.panel.quest{border-color:var(--goldline);box-shadow:0 0 26px rgba(245,201,92,.18),0 0 22px var(--glow),inset 0 0 26px rgba(140,70,255,.12)}
.qtop{display:flex;justify-content:space-between;align-items:flex-end;margin:0 2px 8px}
.qtop .s{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.qtop .t{font-family:'Orbitron';font-size:28px;font-weight:700;color:var(--pur2);text-shadow:0 0 12px var(--pur)}
.qtop .t.warn{color:var(--gold2);text-shadow:0 0 12px rgba(245,201,92,.8)}
.qtop .t.bad{color:var(--red);text-shadow:0 0 12px var(--red)}
.qp{text-align:right}
.qp .pv{font-family:'Orbitron';font-size:28px;font-weight:700;color:var(--gold2)}
.qp .pv small{font-size:16px;color:var(--muted)}
.task .num{font-family:'Orbitron';color:var(--gold2);font-size:17px;margin-right:2px}
.task{transition:.2s}
.banner.bad{border:1px solid rgba(255,80,110,.55);background:rgba(255,60,90,.08);color:#ffc0cc;font-size:14px}

.qzhead{display:flex;justify-content:space-between;font-family:'Orbitron';font-size:11px;letter-spacing:.14em;color:var(--gold)}
.qzq{font-size:21px;font-weight:700;line-height:1.3;margin-bottom:14px;color:var(--pur2)}
.qzl{display:flex;flex-direction:column;gap:8px}
.qzs{display:flex;gap:8px}.qzs .qzo{flex:1;font-family:'Orbitron';font-size:18px}
.qzsl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.qzo{border:1px solid rgba(185,140,255,.4);background:rgba(0,0,0,.25);color:var(--txt);font-family:'Rajdhani';font-weight:600;font-size:16px;padding:11px 12px;border-radius:8px;text-align:left;cursor:pointer}
.qzo.on{border-color:var(--gold);background:rgba(245,201,92,.15);color:var(--gold2);box-shadow:0 0 10px rgba(245,201,92,.25)}
.qzh{font-size:12px;color:var(--muted);margin-top:6px}
textarea{width:100%;font-family:'Rajdhani';font-size:17px;color:var(--txt);background:rgba(0,0,0,.3);border:1px solid rgba(185,140,255,.4);border-radius:8px;padding:10px}
.qznav{display:flex;gap:8px;margin-top:16px}.qznav .rec{flex:1;padding:12px;font-size:16px}
.qznav .rec:disabled{opacity:.35}
.qzx{display:block;margin:12px auto 0;background:none;border:0;color:var(--muted);font-family:'Rajdhani';font-size:14px;text-decoration:underline;cursor:pointer}
.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

<script>
/* ============ REGRAS FIXAS (só o Claude altera as regras) ============ */
const DOC_PATH='sistema/santos';
const EX=[
  {id:'flex',nm:'Flexões',ic:'💪'},
  {id:'abd', nm:'Abdominais',ic:'🔥'},
  {id:'pol', nm:'Polichinelos',ic:'⚡'},
  {id:'agach',nm:'Agachamentos',ic:'🦵'}
];
const RANKS_V1={E:{flex:10,abd:15,pol:20},D:{flex:20,abd:25,pol:40},C:{flex:30,abd:40,pol:60},B:{flex:45,abd:60,pol:80},A:{flex:60,abd:80,pol:100},S:{flex:100,abd:100,pol:150}};
// Regras "modo difícil" a partir de 10/11/2026
const RANKS={E:{flex:20,abd:30,pol:50,agach:30},D:{flex:30,abd:45,pol:80,agach:45},C:{flex:45,abd:60,pol:110,agach:60},B:{flex:60,abd:80,pol:150,agach:80},A:{flex:80,abd:100,pol:200,agach:100},S:{flex:100,abd:100,pol:250,agach:100}};
const RULES_FROM='2026-11-10';
const ORDER=['E','D','C','B','A','S'];
const SCALE=[1,1.5,2,2.7,3.5,5];
const PROMO=10;
const XP_DAY=[100,130,160,200,250,320];
const XP_MISSED_PEN=150, XP_LUNCH=40;
const PEN_HOUR=4, PEN_LIMIT=5;
const WEIGHT_MS=[
  {kg:0.5,xp:100,txt:'+0,5 kg'},
  {kg:1,xp:300,txt:'+1 kg',title:'Corpo Despertado'},
  {kg:2,xp:700,txt:'+2 kg',title:'Massa em Ascensão'},
  {kg:3,xp:1100,txt:'+3 kg'},
  {kg:5,xp:2000,txt:'+5 kg',title:'Colosso em Formação'},
  {kg:8,xp:3500,txt:'+8 kg',title:'Monarca do Corpo'}
];
const ROUTINE_DEF=[
  {de:'07:00',ate:'09:00',nm:'Deslocamento',ic:'🚌'},
  {de:'09:00',ate:'11:30',nm:'Expediente · manhã',ic:'💼'},
  {de:'11:30',ate:'13:30',nm:'Almoço',ic:'🍽️',tip:'Foto do almoço + missão relâmpago até 12h'},
  {de:'13:30',ate:'17:00',nm:'Expediente · tarde',ic:'💼'},
  {de:'17:00',ate:'19:00',nm:'Volta pra casa',ic:'🏠',tip:'Missão da tarde vence às 18h'},
  {de:'19:00',ate:'24:00',nm:'Horário das missões',ic:'⚔️',tip:'Missão diária até 00:00'}
];
const SP_POOL_V1=[
  {k:'agach',nm:'Agachamentos',ic:'🦵',base:15,u:'rep'},
  {k:'prancha',nm:'Prancha',ic:'🧱',base:20,u:'s'},
  {k:'afundo',nm:'Afundos (cada perna)',ic:'🦿',base:6,u:'rep'},
  {k:'pant',nm:'Elevação de panturrilha',ic:'🦶',base:20,u:'rep'},
  {k:'flexex',nm:'Flexões extras',ic:'💪',base:5,u:'rep'},
  {k:'polex',nm:'Polichinelos extras',ic:'⚡',base:20,u:'rep'},
  {k:'abdex',nm:'Abdominais extras',ic:'🔥',base:10,u:'rep'},
  {k:'cadeira',nm:'Cadeira na parede',ic:'🪑',base:20,u:'s'},
  {k:'burpee',nm:'Burpees',ic:'💥',base:3,u:'rep',minRank:1}
];
const SP_POOL=[
  {k:'agach',nm:'Agachamentos extras',ic:'🦵',base:30,u:'rep'},
  {k:'prancha',nm:'Prancha',ic:'🧱',base:45,u:'s'},
  {k:'afundo',nm:'Afundos (cada perna)',ic:'🦿',base:12,u:'rep'},
  {k:'pant',nm:'Elevação de panturrilha',ic:'🦶',base:40,u:'rep'},
  {k:'flexex',nm:'Flexões extras',ic:'💪',base:12,u:'rep'},
  {k:'polex',nm:'Polichinelos extras',ic:'⚡',base:50,u:'rep'},
  {k:'abdex',nm:'Abdominais extras',ic:'🔥',base:25,u:'rep'},
  {k:'cadeira',nm:'Cadeira na parede',ic:'🪑',base:45,u:'s'},
  {k:'burpee',nm:'Burpees',ic:'💥',base:8,u:'rep'},
  {k:'montanha',nm:'Escalador (mountain climber)',ic:'⛰️',base:30,u:'rep'}
];
function rulesFor(d){ return d<RULES_FROM ? {ranks:RANKS_V1,ex:['flex','abd','pol'],pool:SP_POOL_V1,xpMult:1} : {ranks:RANKS,ex:['flex','abd','pol','agach'],pool:SP_POOL,xpMult:1.5}; }
const SLOTS={
  manha:{nm:'Relâmpago da manhã',dl:'12:00',xp:60,hint:'Antes de sair ou no intervalo'},
  tarde:{nm:'Missão da tarde',dl:'18:00',xp:50,hint:'No almoço ou ao fim do expediente'},
  noite:{nm:'Missão noturna',dl:'23:59',xp:40,hint:'Junto da missão diária'}
};
const WEEKLY_POOL=[
  {k:'diarias',nm:'Complete 6 missões diárias',goal:6,xp:300},
  {k:'almoco',nm:'Registre o almoço em 5 dias',goal:5,xp:250},
  {k:'especiais',nm:'Complete 5 missões especiais',goal:5,xp:300},
  {k:'semfalha',nm:'Semana perfeita: 7 de 7',goal:7,xp:450},
  {k:'peso',nm:'Ganhe 0,3 kg na semana',goal:0.3,xp:300,u:'kg'}
];
const MONTHLY_POOL=[
  {k:'diarias',nm:'Complete 20 missões diárias',goal:20,xp:1000},
  {k:'especiais',nm:'Complete 15 missões especiais',goal:15,xp:800},
  {k:'peso',nm:'Ganhe 1 kg no mês',goal:1,xp:1000,u:'kg'},
  {k:'almoco',nm:'Registre o almoço em 18 dias',goal:18,xp:700}
];

/* ============ UTIL ============ */
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return key(d)};
const fmt=k=>{const d=parse(k);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`};
const weekStart=k=>{const d=parse(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return key(d)};
const monthStart=k=>k.slice(0,8)+'01';
const monthEnd=k=>{const d=parse(monthStart(k));d.setMonth(d.getMonth()+1);d.setDate(0);return key(d)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const xpNeed=l=>100+l*60;
const hm2min=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};
const nowMin=d=>d.getHours()*60+d.getMinutes();
const nowHM=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const stamp=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)} ${nowHM(d)}`;
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function rng(seed){let h=2166136261;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function pickN(arr,n,r){const a=arr.slice(),o=[];while(o.length<n&&a.length){o.push(a.splice(Math.floor(r()*a.length),1)[0])}return o}
function mealType(min){return min<630?'café':min<870?'almoço':min<1080?'lanche':'jantar'}

/* ============ MISSÕES ESPECIAIS (geradas pela data + as que o Claude criar) ============ */
function specialsFor(day,rankIdx,D){
  const r=rng('sp-'+day), dow=parse(day).getDay(), weekday=dow>=1&&dow<=5;
  let slots;
  if(weekday){ slots=[r()<0.6?'manha':'tarde']; if(r()<0.55) slots.push('noite'); }
  else slots=['noite'];
  const RU=rulesFor(day), pool=RU.pool.filter(p=>(p.minRank||0)<=rankIdx);
  const exs=pickN(pool,slots.length,r);
  const list=slots.map((s,i)=>{
    const p=exs[i], mult=weekday?1:1.5;
    const target=Math.max(1,Math.round(p.base*SCALE[rankIdx]*mult/(p.u==='s'?5:1))*(p.u==='s'?5:1));
    return {id:`${s}-${p.k}`,slot:s,nm:p.nm,ic:p.ic,target,u:p.u,dl:SLOTS[s].dl,title:SLOTS[s].nm,hint:SLOTS[s].hint,xp:Math.round(SLOTS[s].xp*RU.xpMult*(1+rankIdx*0.2))};
  });
  for(const c of ((D.custom||{})[day]||[])) list.push({id:'c-'+c.id,slot:'custom',nm:c.nm,ic:c.ic||'⭐',target:c.target,u:c.u||'rep',dl:c.dl||'23:59',title:c.title||'Missão especial do Claude',hint:c.desc||'',xp:c.xp||80});
  return list.sort((a,b)=>hm2min(a.dl)-hm2min(b.dl));
}

/* ============ CÁLCULO (tudo derivado dos fatos registrados) ============ */
function derive(D,now){
  const today=key(now), nm=nowMin(now);
  const R={rank:'E',rankIdx:0,atRank:0,xp:0,streak:0,best:0,done:0,fails:0,spDone:0,lunchDays:0,
    tot:{flex:0,abd:0,pol:0,agach:0},penXP:0,days:{},pens:[],weekly:0,titles:[],events:[]};
  if(!D||!D.startDay) return R;
  for(let d=D.startDay; d<=today; d=addDays(d,1)){
    const RU=rulesFor(d), exList=EX.filter(e=>RU.ex.includes(e.id));
    const rank=ORDER[R.rankIdx], tgt=RU.ranks[rank], rec=(D.days||{})[d]||{}, items=rec.items||{};
    let all=true;
    for(const e of exList){ const it=items[e.id]; if(it&&it.ok){ R.tot[e.id]+=(it.n||tgt[e.id]); } else all=false; }
    // especiais
    const sps=specialsFor(d,R.rankIdx,D), sd=(D.specialDone||{})[d]||{};
    let spCount=0;
    for(const s of sps){
      const ok=sd[s.id]&&sd[s.id].ok;
      s.status= ok?'done' : (d<today || (d===today && nm>=hm2min(s.dl)))?'lost':'open';
      s.at=ok?sd[s.id].at:null; s.n=(sd[s.id]&&sd[s.id].n)||0;
      if(ok){ spCount++; R.spDone++; R.xp+=s.xp; }
    }
    // refeições
    const meals=(D.meals||{})[d]||[];
    const lunch=meals.some(m=>m.tipo==='almoço');
    if(lunch){ R.lunchDays++; R.xp+=XP_LUNCH; }
    const kcal=meals.reduce((a,m)=>a+(Number(m.kcal)||0),0), prot=meals.reduce((a,m)=>a+(Number(m.prot)||0),0);
    const info={rank,rankIdx:R.rankIdx,tgt,ex:exList,items,complete:all,specials:sps,spCount,meals,lunch,kcal,prot};
    R.days[d]=info;
    if(all){
      R.done++; R.streak++; R.best=Math.max(R.best,R.streak); R.xp+=XP_DAY[R.rankIdx]; R.atRank++;
      if(R.streak%7===0){ R.weekly++; }
      if(R.atRank>=PROMO && R.rankIdx<ORDER.length-1){ R.rankIdx++; R.atRank=0; R.xp+=500; }
    }else if(d<today){
      R.fails++; R.streak=0; info.failed=true;
      const pd=addDays(d,1), pr=(D.penalties||{})[pd];
      const limit=parse(pd); limit.setHours(PEN_LIMIT,0,0,0);
      let st='pending';
      if(pr&&pr.ok) st='done'; else if(now>=limit){ st='missed'; R.penXP+=XP_MISSED_PEN; }
      R.pens.push({failDay:d,day:pd,status:st,at:pr&&pr.at});
    }
  }
  // peso
  const W=(D.weights||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
  const base=D.baseWeight||(W[0]&&W[0].kg)||0;
  const maxKg=W.reduce((m,w)=>Math.max(m,w.kg),base);
  const gain=Math.round((maxKg-base)*10)/10;
  R.weight={base,cur:W.length?W[W.length-1].kg:base,last:W.length?W[W.length-1].d:null,max:maxKg,gain,list:W};
  for(const m of WEIGHT_MS){ if(gain>=m.kg){ R.xp+=m.xp; if(m.title) R.titles.push(m.title); } }
  // desafios semanais e mensais (todas as semanas/meses desde o início contam XP)
  const evalCh=(ch,from,to)=>{
    const a=from<D.startDay?D.startDay:from, b=to>today?today:to;
    let prog=0;
    if(ch.k==='peso'){
      const before=W.filter(w=>w.d<from); const ref=before.length?before[before.length-1].kg:base;
      const inR=W.filter(w=>w.d>=from&&w.d<=to); const mx=inR.reduce((m,w)=>Math.max(m,w.kg),ref);
      prog=Math.round((mx-ref)*10)/10;
    }else for(let d=a; d<=b; d=addDays(d,1)){ const i=R.days[d]; if(!i) continue;
      if(ch.k==='diarias'||ch.k==='semfalha') prog+=i.complete?1:0;
      else if(ch.k==='almoco') prog+=i.lunch?1:0;
      else if(ch.k==='especiais') prog+=i.spCount; }
    return {...ch,prog,ok:prog>=ch.goal};
  };
  R.weeklyCh=[]; R.monthlyCh=[];
  for(let w=weekStart(D.startDay); w<=today; w=addDays(w,7)){
    const chs=pickN(WEEKLY_POOL,3,rng('wk-'+w)).map(c=>evalCh(c,w,addDays(w,6)));
    for(const c of chs) if(c.ok) R.xp+=c.xp;
    if(w===weekStart(today)) R.weeklyCh=chs;
  }
  for(let m=monthStart(D.startDay); m<=today; m=addDays(monthEnd(m),1)){
    const chs=pickN(MONTHLY_POOL,2,rng('mo-'+m)).map(c=>evalCh(c,m,monthEnd(m)));
    for(const c of chs) if(c.ok) R.xp+=c.xp;
    if(m===monthStart(today)) R.monthlyCh=chs;
  }
  R.xp+=Object.keys(D.quizzes||{}).length*XP_QUIZ;
  R.xp=Math.max(0,R.xp-R.penXP);
  R.rank=ORDER[R.rankIdx];
  R.claimed=(D.rewardsClaimed||0);
  R.pendingRewards=Math.max(0,R.weekly-R.claimed);
  let lv=1, xp=R.xp; while(xp>=xpNeed(lv)){ xp-=xpNeed(lv); lv++; }
  R.level=lv; R.xpIn=xp; R.xpNeed=xpNeed(lv);
  R.attr={
    FOR:10+Math.floor(R.tot.flex/20)+Math.floor(R.tot.agach/40)+lv-1,
    VIT:10+Math.floor(R.tot.abd/25)+lv-1,
    AGI:10+Math.floor(R.tot.pol/30)+lv-1,
    MAS:10+Math.floor(Math.max(0,gain)*4)+Math.floor(R.lunchDays/3),
    DIS:10+R.best+Math.floor(R.spDone/2)
  };
  R.title=R.titles.length?R.titles[R.titles.length-1]:
    R.best>=21?'Caçador Disciplinado':R.best>=7?'Aquele que Não Desiste':R.done>=1?'Despertado':'O Mais Fraco da Humanidade';
  R.todayInfo=R.days[today];
  R.todayPen=R.pens.find(p=>p.day===today&&p.status==='pending');
  return R;
}

/* ============ UI ============ */
let D=null, tab='hoje', popShown=false;
function countdownTo(now,hm){
  const end=new Date(now.getTime()); if(hm==='24:00'||hm==='23:59'){ end.setHours(24,0,0,0); } else { const [h,m]=hm.split(':').map(Number); end.setHours(h,m,0,0); }
  const ms=Math.max(0,end-now), H=Math.floor(ms/3.6e6), M=Math.floor(ms%3.6e6/6e4), S=Math.floor(ms%6e4/1e3);
  return {txt:`${pad(H)}:${pad(M)}:${pad(S)}`,short:H?`${H}h${pad(M)}`:`${M} min`,cls:ms<3600000?'bad':ms<3*3600000?'warn':'',ms};
}
const unitTxt=s=>s.u==='s'?`${s.target} s`:`${s.target}`;
function header(R){
  const nx=ORDER[R.rankIdx+1];
  return `<div class="panel player">
    <div class="head">
      <div><div class="tag">JOGADOR</div><div class="name">${esc(D.name||'Santos')}</div><div class="title">« ${esc(R.title)} »</div></div>
      <div class="rank"><small>RANK</small>${R.rank}</div>
    </div>
    <div class="tiles">
      <div class="tile"><b>${R.level}</b><span>Nível</span></div>
      <div class="tile f"><b>${R.streak}🔥</b><span>Sequência</span></div>
      <div class="tile g"><b>${R.weight.cur.toFixed(1)}</b><span>kg</span></div>
      <div class="tile"><b>${nx?`${R.atRank}/${PROMO}`:'MAX'}</b><span>${nx?`→ Rank ${nx}`:'Rank'}</span></div>
    </div>
    <div class="lbl"><span>EXPERIÊNCIA</span><span>${R.xpIn} / ${R.xpNeed} XP</span></div>
    <div class="bar"><i style="width:${Math.min(100,R.xpIn/R.xpNeed*100)}%"></i></div>
  </div>`;
}
function routineCard(now){
  const RT=(D.routine&&D.routine.length)?D.routine:ROUTINE_DEF, m=nowMin(now);
  return `<div class="panel"><div class="ptitle"><h2>SUA ROTINA DE HOJE</h2></div>

function weightChart(W){
  if(W.length<2) return '<div class="empty">O gráfico aparece a partir da 2ª pesagem.</div>';
  const w=320,h=140,p=22, ks=W.map(x=>x.kg), mn=Math.min(...ks)-0.5, mx=Math.max(...ks)+0.5;
  const X=i=>p+i*(w-2*p)/(W.length-1), Y=v=>h-p-(v-mn)/(mx-mn)*(h-2*p);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}"><polyline points="${W.map((x,i)=>`${X(i)},${Y(x.kg)}`).join(' ')}" fill="none" stroke="#f5c95c" stroke-width="2.5"/>
    ${W.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.kg)}" r="3.5" fill="#b98cff"/>`).join('')}
    <text x="${p}" y="${h-4}" fill="#9a88bd" font-size="10">${fmt(W[0].d)}</text>
    <text x="${w-p}" y="${h-4}" fill="#9a88bd" font-size="10" text-anchor="end">${fmt(W[W.length-1].d)}</text></svg>`;
}
function kcalChart(R,now){
  const today=key(now), days=[]; for(let i=6;i>=0;i--){const d=addDays(today,-i); days.push({d,k:(R.days[d]&&R.days[d].kcal)||0});}
  const mx=Math.max(1000,...days.map(x=>x.k));
  return `<div class="bars">${days.map(x=>`<div class="bc"><div class="bb" style="height:${x.k/mx*100}%"></div><small>${parse(x.d).getDate()}</small></div>`).join('')}</div>`;
}

function nav(R){

function popup(R,now){
  const T=R.todayInfo; if(!T) return;

}
function render(){
  if(!D) return;
  const now=new Date(), R=derive(D,now);
  const pen=!!R.todayPen;
  document.body.classList.toggle('penalty',pen);
  document.getElementById('sysTxt').textContent=pen?'PENALIDADE ATIVA':'SISTEMA ONLINE';
  const v= tab==='hoje'?viewHoje(R,now): tab==='desafios'?viewDesafios(R,now): tab==='corpo'?viewCorpo(R,now): tab==='status'?viewStatus(R,now): viewLog(R,now);

        else done(`◐ <b>${esc(nmEx)}: ${tot}/${tgt}</b><br><small>Este vídeo valeu +${n}. Faltam ${tgt-tot}${sp&&sp.u==='s'?' s':''} — grave o restante em outra série.</small><br><small style="color:var(--muted)">${esc(res.motivo||'')}</small>`);
      }else{
        await pref.update({status:'recusada',motivo:String(res.motivo||'').slice(0,200),repeticoes:n});
        done(`✗ <b>Prova recusada</b><br><small>${esc(res.motivo||'')}</small><br><small style="color:var(--muted)">Grave de novo dentro do prazo.</small>`,true);
      }
    }else if(ex==='peso'){
      const kg=Math.round(Number(res.kg)*10)/10;
      if(res.legivel&&kg>25&&kg<250){
        await pref.update({status:'aprovada',motivo:`Lido: ${kg.toFixed(1)} kg`,kg});
        const W=(D.weights||[]).filter(w=>w.d!==day); W.push({d:day,kg});
        await writeState({weights:W},`⚖️ Pesagem: ${kg.toFixed(1)} kg.`,now);
        done(`⚖️ <b>${kg.toFixed(1)} kg</b> registrado!`);
      }else{ await pref.update({status:'recusada',motivo:String(res.motivo||'Não foi possível ler o peso.')}); done(`✗ Não consegui ler a balança.<br><small>${esc(res.motivo||'')}</small>`,true); }
    }else if(ex==='meal'){
      if(res.comida){
        const kcal=Math.max(0,Math.round(Number(res.kcal)||0)), prot=Math.max(0,Math.round(Number(res.proteina_g)||0)), tipo=mealType(nowMin(now));
        await pref.update({status:'aprovada',motivo:`${tipo}: ~${kcal} kcal`,kcal});
        const arr=((D.meals||{})[day]||[]).slice(); arr.push({t:time,tipo,kcal,prot,desc:String(res.descricao||'').slice(0,160),dica:String(res.dica||'').slice(0,160)});
        const bonus=tipo==='almoço'&&!T.lunch;
        await writeState({meals:{[day]:arr}},`🍽️ ${tipo}: ~${kcal} kcal, ${prot} g de proteína${bonus?` · +${XP_LUNCH} XP`:''}.`,now);
        done(`🍽️ <b>${tipo[0].toUpperCase()+tipo.slice(1)}: ~${kcal} kcal</b><br><small>${esc(res.descricao||'')}</small><br><small style="color:var(--gold2)">💡 ${esc(res.dica||'')}</small>${bonus?`<br><b style="color:var(--green)">+${XP_LUNCH} XP · missão do almoço</b>`:''}`);
      }else{ await pref.update({status:'recusada',motivo:'Não parece ser comida.'}); done('✗ Não identifiquei comida na foto.',true); }
    }else{
      const ok=!!res.aprovado;
      await pref.update({status:ok?'aprovada':'recusada',motivo:String(res.motivo||'')});
      if(ok){ await writeState({penalties:{[day]:{ok:true,at:time}}},`🥶 Banho gelado cumprido às ${time}.`,now); done('🥶 <b>Penalidade cumprida.</b>'); }
      else done(`✗ Foto recusada.<br><small>${esc(res.motivo||'')}</small>`,true);
    }
  }catch(err){ done('Falha ao registrar o resultado. Tente de novo.',true); }
}

/* ============ PROVAS (vídeo/foto pelo app) ============ */
const PLABEL={agach:'🦵 Agachamentos',flex:'💪 Flexões',abd:'🔥 Abdominais',pol:'⚡ Polichinelos',peso:'⚖️ Balança',banho:'🥶 Banho gelado',meal:'🍽️ Refeição'};
function sentToday(ex){ const t=key(new Date()); return PROVAS.some(p=>p.ex===ex&&p.day===t&&p.status==='aguardando'); }
function provasHtml(day){
  const L=PROVAS.filter(p=>p.day===day).sort((a,b)=>a.sentAt<b.sentAt?1:-1);
  if(!L.length) return '<div class="empty">Nenhuma prova enviada hoje.</div>';
  return L.map(p=>{const st=p.status==='aprovada'?['ok','✓ APROVADA']:p.status==='recusada'?['no','✗ RECUSADA']:['wait','ANALISANDO'];
    const lab=PLABEL[p.ex]||(p.ex.startsWith('sp:')?'✦ Especial':esc(p.ex));
    return `<div class="prova"><span>${lab} · ${esc(p.time)}${p.motivo?`<br><small style="color:var(--muted)">${esc(p.motivo)}</small>`:''}</span><span class="s ${st[0]}">${st[1]}</span></div>`}).join('');
}
function busy(msg){document.getElementById('modalBody').innerHTML=`<div class="ptitle"><h2>[ SISTEMA ]</h2></div><div class="spin"></div><div style="text-align:center" id="busyTxt">${msg}</div>`;document.getElementById('modal').classList.add('show');}
function busyTxt(m){const e=document.getElementById('busyTxt'); if(e) e.textContent=m;}
function done(msg,bad){document.getElementById('modalBody').innerHTML=`<div class="ptitle"><h2>[ SISTEMA ]</h2></div><div style="text-align:center;font-size:18px;line-height:1.4">${msg}</div><button class="mbtn ${bad?'red':''}" id="mok">OK</button>`;
  document.getElementById('modal').classList.add('show');document.getElementById('mok').onclick=()=>document.getElementById('modal').classList.remove('show');}
function canvasBlob(c,q){return new Promise(r=>c.toBlob(r,'image/jpeg',q));}

/* Sensor de movimento: conta ciclos repetitivos a partir dos quadros (PCA + histerese + autocorrelação) */
function motionCount(F,fps){
  const N=F.length; if(N<12) return null; const P=F[0].length;
  const mean=new Float32Array(P); for(const f of F) for(let j=0;j<P;j++) mean[j]+=f[j]/N;
  const X=F.map(f=>{const o=new Float32Array(P); for(let j=0;j<P;j++) o[j]=f[j]-mean[j]; return o;});
  let v=new Float32Array(P).map(()=>Math.random()-.5), s=new Float32Array(N);
  for(let it=0;it<20;it++){
    for(let i=0;i<N;i++){ let a=0; const x=X[i]; for(let j=0;j<P;j++) a+=x[j]*v[j]; s[i]=a; }
    const nv=new Float32Array(P); for(let i=0;i<N;i++){ const x=X[i], si=s[i]; for(let j=0;j<P;j++) nv[j]+=x[j]*si; }
    let nr=0; for(let j=0;j<P;j++) nr+=nv[j]*nv[j]; nr=Math.sqrt(nr)||1; for(let j=0;j<P;j++) v[j]=nv[j]/nr;
  }
  const ma=(a,w)=>a.map((_,i)=>{let t=0,c=0; for(let k=Math.max(0,i-w);k<=Math.min(a.length-1,i+w);k++){t+=a[k];c++;} return t/c;});
  let sm=Array.from(s); const tr=ma(sm,Math.max(2,Math.round(fps*2.5))); sm=sm.map((x,i)=>x-tr[i]);
  const sd=Math.sqrt(sm.reduce((a,x)=>a+x*x,0)/N)||1, th=0.35*sd;
  let st=0, cyc=0; for(const x of sm){ if(st<=0&&x>th){ if(st<0) cyc++; st=1; } else if(st>=0&&x<-th){ st=-1; } }
  const ac=[]; const L0=Math.max(1,Math.round(fps*0.45)), L1=Math.min(Math.floor(N/2),Math.round(fps*8)); for(let L=0;L<=L1;L++){ let a=0; for(let i=0;i+L<N;i++) a+=sm[i]*sm[i+L]; ac[L]=a/((N-L)*sd*sd); }
  let best=0, lag=0; for(let L=Math.max(L0,1);L<L1;L++){ if(ac[L]>0.3&&ac[L]>=ac[L-1]&&ac[L]>=ac[L+1]){ best=ac[L]; lag=L; break; } }
  if(!lag){ for(let L=L0;L<=L1;L++) if(ac[L]>best){best=ac[L];lag=L;} }
  const active=sm.filter((x,i)=>{ let m=0; for(let k=Math.max(0,i-3);k<=Math.min(N-1,i+3);k++) m=Math.max(m,Math.abs(sm[k])); return m>th; }).length/fps;
  const period=lag?lag/fps:null;
  return {ciclos:cyc, periodo:period?Math.round(period*10)/10:null, porTempo:period&&best>0.3?Math.round(active/period):null, confianca:Math.round(best*100)/100};
}
async function videoSheets(file){
  const url=URL.createObjectURL(file), v=document.createElement('video');
  v.muted=true; v.playsInline=true; v.setAttribute('playsinline',''); v.setAttribute('muted',''); v.preload='auto'; v.src=url;
  v.style.cssText='position:fixed;left:-9999px;width:2px;height:2px'; document.body.appendChild(v);
  const cleanup=()=>{ try{v.pause();v.removeAttribute('src');v.load();v.remove();}catch(e){} URL.revokeObjectURL(url); };
  try{
    await new Promise((res,rej)=>{ let ok=false; v.onloadedmetadata=()=>{ok=true;res()}; v.onerror=()=>rej(new Error('decode:'+(v.error&&v.error.code))); setTimeout(()=>{ if(!ok) rej(new Error('timeout-meta')) },45000); });
    let dur=v.duration;
    if(!isFinite(dur)||!dur){ // alguns celulares gravam sem duração no cabeçalho
      await new Promise(r=>{ v.ontimeupdate=()=>{ v.ontimeupdate=null; r(); }; v.currentTime=1e7; setTimeout(r,8000); });
      dur=v.duration; v.currentTime=0;
    }
    if(!isFinite(dur)||!dur) throw new Error('sem-duracao');
    try{ await v.play(); v.pause(); }catch(e){}
    const N=Math.min(240,Math.max(24,Math.round(dur*4)));
    const vw=v.videoWidth||720, vh=v.videoHeight||1280;
    const PER=Math.max(20,Math.ceil(N/8)), COLS=5, ROWS=Math.ceil(PER/COLS);
    const W=176, H=Math.round(W*vh/vw)||313;
    const sheets=[], SW=24, SH=Math.max(16,Math.round(SW*vh/vw)), small=document.createElement('canvas'); small.width=SW; small.height=SH;
    const sctx=small.getContext('2d',{willReadFrequently:true}), grays=[], times=[];
    let c=null, ctx=null, blank=0;
    for(let i=0;i<N;i++){
      const t=Math.min(dur-0.05,(i+0.5)*dur/N);
      await new Promise(r=>{ let d=false; const fin=()=>{ if(!d){d=true;r();} }; v.onseeked=fin; v.currentTime=t; setTimeout(fin,4000); });
      if(i%PER===0){ if(c) sheets.push(c); c=document.createElement('canvas'); c.width=W*COLS; c.height=H*ROWS; ctx=c.getContext('2d'); ctx.fillStyle='#000'; ctx.fillRect(0,0,c.width,c.height); }
      const k=i%PER, x=(k%COLS)*W, y=Math.floor(k/COLS)*H;
      try{ ctx.drawImage(v,x,y,W,H); sctx.drawImage(v,0,0,SW,SH); const px=sctx.getImageData(0,0,SW,SH).data, g=new Float32Array(SW*SH); for(let j=0;j<g.length;j++) g[j]=(px[j*4]*.3+px[j*4+1]*.59+px[j*4+2]*.11); grays.push(g); times.push(t); }catch(e){ blank++; }
      ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(x,y,58,18); ctx.fillStyle='#ffe08a'; ctx.font='bold 13px sans-serif'; ctx.fillText(t.toFixed(1)+'s',x+4,y+14);
      busyTxt(`Processando vídeo… ${Math.round((i+1)/N*100)}%`);
    }
    if(c) sheets.push(c);
    if(blank>N/2) throw new Error('quadros-vazios');
    const blobs=[]; for(const sc of sheets) blobs.push(await canvasBlob(sc,0.75));
    let sensor=null; try{ sensor=motionCount(grays,N/dur); }catch(e){}
    return {blobs,dur,frames:N,sensor};
  }finally{ cleanup(); }
}
async function imageBlob(file){
  const url=URL.createObjectURL(file), img=new Image();
  await new Promise((res,rej)=>{img.onload=res; img.onerror=rej; img.src=url;});
  const sc=Math.min(1,1280/Math.max(img.width,img.height)), c=document.createElement('canvas');
  c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(url); return canvasBlob(c,0.82);
}
async function handleFile(ex,file){
  if(!assetsNs||!dbRef){ done('Envio indisponível nesta tela. Abra o Sistema pelo app do Claude.',true); return; }
  const now=new Date(), day=key(now), time=nowHM(now);
  busy('Preparando a prova…');
  try{
    let ids=[], meta={}, imgs=[];
    if(file.type.startsWith('video')){
      let r=null, why='';
      try{ r=await videoSheets(file); }catch(e){ r=null; why=(e&&e.message)||'erro'; }
      if(!r){ try{ await dbRef.collection('erros').doc().set({quando:now.toISOString(),ex,tipo:file.type||'?',mb:Math.round(file.size/1048576*10)/10,motivo:why,ua:navigator.userAgent.slice(0,160)}); }catch(e){} }
      if(r){ imgs=r.blobs; for(let i=0;i<r.blobs.length;i++){ busyTxt(`Enviando ${i+1}/${r.blobs.length}…`); const a=await assetsNs.upload(r.blobs[i]); ids.push(a.id);} meta={tipo:'video',duracao:Math.round(r.dur*10)/10,quadros:r.frames,sensor:r.sensor||null}; }
      else if(file.size<=20*1024*1024){ busyTxt('Enviando vídeo…'); const a=await assetsNs.upload(file); ids.push(a.id); meta={tipo:'video-original'}; }
      else throw new Error(`O celular não deixou o app ler esse vídeo (${why}, ${Math.round(file.size/1048576)} MB).<br><small>Tente gravar mais curto (até ~25 s) ou escolher o vídeo pela galeria. O erro foi registrado para o Claude analisar.</small>`);
    }else{
      const b=await imageBlob(file); imgs=[b]; busyTxt('Enviando foto…'); const a=await assetsNs.upload(b); ids.push(a.id); meta={tipo:'foto'};
    }
    const pref=dbRef.collection('provas').doc();
    await pref.set({ex,day,time,sentAt:now.toISOString(),gravadoEm:file.lastModified?new Date(file.lastModified).toISOString():null,assets:ids,...meta,status:'aguardando'});
    await verify(pref,ex,day,time,now,imgs,meta);
  }catch(e){ done((e&&e.message&&!e.code)?e.message:'Falha ao enviar. Tente de novo.',true); }
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-up]'); if(!b) return;
  const ex=b.dataset.up;
  if(ex.startsWith('sp:')&&D){ const R=derive(D,new Date()), s=R.todayInfo.specials.find(x=>x.id===ex.slice(3)); if(!s||s.status!=='open'){ done('⛔ Essa missão especial já passou do prazo.',true); render(); return; } }
  const inp=document.getElementById('fileIn');
  inp.value=''; inp.accept=(ex==='peso'||ex==='banho'||ex==='meal')?'image/*':'video/*'; inp.removeAttribute('capture');
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(f) handleFile(ex,f); };
  inp.click();
});

/* ============ DADOS ============ */
function setSync(t){document.getElementById('sync').textContent=t}
let lastDay=key(new Date()), lastMin=nowMin(new Date());
setInterval(()=>{
  const now=new Date(), d=key(now), m=nowMin(now);
  if(d!==lastDay){ lastDay=d; popShown=false; render(); return; }
  if(m!==lastMin){ lastMin=m; render(); return; }
  const el=document.getElementById('cd'); if(el){ const c=countdownTo(now,'24:00'); el.textContent=c.txt; el.className='t '+c.cls; }
},1000);
(async function boot(){
  const timer=setTimeout(()=>setSync('Não foi possível alcançar o Sistema ainda — os dados podem estar desatualizados.'),10000);
  try{
    if(!window.claude||!window.claude.use) throw 0;
    const db=await window.claude.use('db'); if(!db) throw 0;
    dbRef=db;
    try{ assetsNs=await window.claude.use('assets'); }catch(e){ assetsNs=null; }
    try{ sampleNs=await window.claude.use('sample'); }catch(e){ sampleNs=null; }
    db.collection('provas').orderBy('sentAt','desc').limit(80).onSnapshot(q=>{ PROVAS=q.docs.map(d=>({id:d.id,...d.data()})); render(); },()=>{});
    db.doc(DOC_PATH).onSnapshot(snap=>{
      if(!snap.metadata.fromCache){ clearTimeout(timer); setSync('🔒 Regras controladas pelo Claude · atualizado ao vivo'); }
      if(snap.exists){ D=snap.data(); render(); }
      else document.getElementById('app').innerHTML='<div class="panel"><div class="empty">O Sistema ainda não foi iniciado.</div></div>';
    },()=>{clearTimeout(timer);setSync('Conexão com o Sistema perdida. Reabra a página.')});
  }catch(e){ clearTimeout(timer); document.getElementById('app').innerHTML='<div class="panel"><div class="empty">Abra esta página pelo app do Claude para ver o Sistema.</div></div>'; }
})();
