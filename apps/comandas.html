<style>
:root{--bg:#14100d;--card:#221b16;--tx:#f6ebdf;--mut:#b8a393;--bd:#3b2f26;--pri:#f26a1b;--gold:#f5b301;--ok:#2f9e44;--okbg:#1f3d27;--ocbg:#3d2314;--r:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-bottom:70px}
header{display:flex;align-items:center;gap:10px;padding:12px 124px 10px 16px;font-weight:800;font-size:19px;line-height:1.15}
header img{width:46px;height:46px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;flex:none}
#hd{min-width:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 12px}
.mesa{border:2px solid var(--bd);background:var(--card);border-radius:var(--r);padding:14px 4px;text-align:center;font-size:15px;color:var(--tx)}
.mesa b{display:block;font-size:22px}.mesa small{color:var(--mut)}
.mesa.oc{background:var(--ocbg);border-color:var(--pri)}.mesa.pg{background:var(--okbg);border-color:var(--ok)}
nav{position:fixed;z-index:10;display:flex;background:var(--card);bottom:0;left:0;right:0;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}

nav button span{font-size:22px}nav button.on{color:var(--pri);font-weight:700}

html[data-nav=l] nav{top:env(safe-area-inset-top,0px);bottom:0;right:auto;width:72px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--bd);padding-bottom:0}

.pg_{padding:0 12px}.row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:calc(var(--r) - 2px);padding:10px 12px;margin-bottom:8px}
.row .n{flex:1}.row .n small{display:block;color:var(--mut)}
.q{width:40px;height:40px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:22px}.q.m{background:var(--bd);color:var(--tx)}
.qt{min-width:22px;text-align:center;font-weight:700}
.btn{padding:14px;border-radius:calc(var(--r) - 2px);border:0;background:var(--pri);color:#fff;font-size:16px;font-weight:700;width:100%;margin-top:8px}.btn.g{background:var(--ok)}.btn.s{background:var(--bd);color:var(--tx)}

.tot .v{font-size:26px;font-weight:800}

.hid{display:none}h3{margin:14px 0 6px}.msg{color:var(--mut);font-size:14px;margin:6px 0}
.tl{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px 4px;text-align:center;color:var(--tx);position:relative;font:inherit;min-height:100px}.tl .e{font-size:28px;display:block}.tl b{font-size:13px;display:block;margin:2px 0}.tl small{color:var(--mut)}.tl i{position:absolute;top:4px;right:6px;background:var(--pri);color:#fff;border-radius:10px;font-style:normal;font-size:12px;padding:1px 7px}
.ch{padding:8px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);white-space:nowrap;font:inherit;font-size:14px}.ch.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tb{display:flex;border-bottom:1px solid var(--bd);margin-bottom:10px}.tb button{flex:1;padding:12px;border:0;background:none;color:var(--mut);font:inherit;border-bottom:3px solid transparent}.tb button.on{color:var(--pri);font-weight:700;border-color:var(--pri)}
.bd{display:inline-block;color:#fff;border-radius:calc(var(--r) - 2px);padding:3px 10px;font-size:13px;font-weight:700}
.cm{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--bd);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--gold));color:#1a0f08;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none}
.nb{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:14px}
.nb input{font-size:18px;padding:14px;margin:0}
.btn.big{background:linear-gradient(135deg,var(--pri),var(--gold));color:#1a0f08;font-size:19px;padding:17px}
button[disabled]{opacity:.4}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.cb{flex:1;display:block;text-align:left;color:var(--tx);font:inherit;padding:14px;border:0;background:none;min-width:0}
.cd{width:58px;border:0;background:var(--ok);color:#fff;font-size:24px}
.pl{white-space:nowrap;display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800;margin:4px 6px 0 0}
.tl{box-shadow:inset 0 4px 0 var(--bd);padding-top:16px;min-height:84px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.tl.k-e{box-shadow:inset 0 4px 0 var(--pri)}.tl.k-j{box-shadow:inset 0 4px 0 var(--gold)}.tl.k-b{box-shadow:inset 0 4px 0 #4dabf7}
.tl b{font-size:15px;line-height:1.2}.tl small{color:var(--gold);font-weight:700}
.tl i{position:absolute;top:-8px;right:-4px;min-width:22px;padding:1px 6px;border-radius:999px;background:var(--pri);color:#1a0f08;font-style:normal;font-weight:800;font-size:13px}
.sl{padding:10px;border-radius:10px;background:var(--card);color:var(--tx);border:1px solid var(--bd);font-size:15px;max-width:55%}
